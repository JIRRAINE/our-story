<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Story - Days Together</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #fff5f5; color: #4a4a4a; -webkit-tap-highlight-color: transparent; }
        .font-handwritten { font-family: 'Dancing Script', cursive; }
        .glass-card { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 24px; }
        .hidden-page { display: none; }
        .active-page { display: block; }
        .heart-animation { animation: heartBeat 1.5s infinite; }
        @keyframes heartBeat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #ec4899; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .time-pill { background: rgba(255, 255, 255, 0.6); border: 1px solid rgba(236, 72, 153, 0.1); border-radius: 12px; padding: 8px 12px; text-align: center; }
    </style>
</head>
<body class="max-w-md mx-auto min-h-screen shadow-2xl relative overflow-x-hidden">

    <div id="loadingOverlay" class="fixed inset-0 bg-white z-[100] flex flex-col items-center justify-center">
        <div class="loader mb-4"></div>
        <p id="loadingText" class="text-pink-500 font-medium">Opening our scrapbook...</p>
    </div>

    <button id="logoutBtn" class="fixed top-4 right-4 z-50 bg-white/50 px-3 py-1 rounded-full text-[10px] font-bold text-gray-400 uppercase hidden">Sign Out</button>

    <nav class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[90%] glass-card z-50 flex justify-around py-4 shadow-lg border border-pink-100">
        <button onclick="showPage('home')" id="nav-home" class="nav-btn text-pink-500"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg></button>
        <button onclick="showPage('gallery')" id="nav-gallery" class="nav-btn text-pink-300"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M22 16V4c0-1.1-.9-2-2-2H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2zm-11-4l2.03 2.71L16 11l4 5H8l3-4zM2 6v14c0 1.1.9 2 2 2h14v-2H4V6H2z"/></svg></button>
        <button onclick="showPage('letters')" id="nav-letters" class="nav-btn text-pink-300"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg></button>
    </nav>

    <div id="home" class="page active-page p-6 pb-24 text-center">
        <div class="mt-12 mb-8 flex justify-center">
            <div class="relative inline-block p-4 rounded-full bg-white shadow-xl">
                <div class="w-32 h-32 rounded-full bg-pink-100 flex items-center justify-center text-4xl overflow-hidden">👩‍❤️‍👨</div>
                <div class="absolute -bottom-2 -right-2 bg-pink-500 text-white p-2 rounded-full heart-animation">❤️</div>
            </div>
        </div>
        <h1 class="text-4xl font-handwritten text-pink-600 mb-2">Our Story</h1>
        <div class="glass-card p-6 mb-4 shadow-sm">
            <div id="counter" class="grid grid-cols-3 gap-2">
                <div><span id="days" class="text-2xl font-bold text-gray-800">0</span><p class="text-[10px]">DAYS</p></div>
                <div><span id="hours" class="text-2xl font-bold text-gray-800">0</span><p class="text-[10px]">HOURS</p></div>
                <div><span id="mins" class="text-2xl font-bold text-gray-800">0</span><p class="text-[10px]">MINS</p></div>
            </div>
        </div>
        <div class="p-4 bg-white/50 rounded-2xl border border-pink-100 text-gray-600 text-sm italic">"Since Jan 6, 2025"</div>
    </div>

    <div id="gallery" class="page hidden-page p-6 pb-24">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold text-gray-800">Moments</h2>
            <label class="bg-pink-500 text-white p-2 rounded-full cursor-pointer shadow-lg active:scale-95">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                <input type="file" id="photoInput" class="hidden" accept="image/*">
            </label>
        </div>
        <div id="photoGrid" class="grid grid-cols-2 gap-4"></div>
    </div>

    <div id="letters" class="page hidden-page p-6 pb-24">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold text-gray-800">Letters</h2>
            <button id="addLetterBtn" class="bg-pink-500 text-white p-2 rounded-full shadow-lg"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg></button>
        </div>
        <div id="letterList" class="space-y-4"></div>
    </div>

    <div id="letterModal" class="fixed inset-0 bg-black/50 z-[60] hidden flex items-center justify-center p-6">
        <div class="bg-white w-full rounded-3xl p-6 shadow-2xl">
            <textarea id="letterText" class="w-full h-40 p-4 border border-pink-100 rounded-2xl outline-none mb-4" placeholder="Write something sweet..."></textarea>
            <div class="flex gap-2">
                <button id="closeLetterModal" class="flex-1 py-3 bg-gray-100 rounded-xl">Cancel</button>
                <button id="saveLetterBtn" class="flex-1 py-3 bg-pink-500 text-white rounded-xl">Save</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSy...", // RE-PASTE YOUR API KEY HERE
            authDomain: "our-story-42b52.firebaseapp.com",
            projectId: "our-story-42b52",
            storageBucket: "our-story-42b52.firebasestorage.app",
            messagingSenderId: "...",
            appId: "..."
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const startDate = new Date('2025-01-06T00:00:00');

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('loadingOverlay').style.display = 'none';
                document.getElementById('logoutBtn').classList.remove('hidden');
                startSync();
            } else {
                // If not logged in, trigger Google Login (simplest for free plan)
                const provider = new GoogleAuthProvider();
                signInWithPopup(auth, provider);
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth).then(() => location.reload()));

        function startSync() {
            onSnapshot(query(collection(db, 'photos'), orderBy('timestamp', 'desc')), (snap) => {
                const grid = document.getElementById('photoGrid');
                grid.innerHTML = snap.docs.map(d => `
                    <div class="relative aspect-square rounded-2xl overflow-hidden shadow-md bg-white">
                        <img src="${d.data().url}" class="w-full h-full object-cover">
                        <button onclick="deleteItem('photos', '${d.id}')" class="absolute top-2 right-2 bg-black/20 text-white rounded-full p-1">✕</button>
                    </div>
                `).join('') || '<p class="col-span-2 text-center text-gray-400 py-10">No photos yet.</p>';
            });

            onSnapshot(query(collection(db, 'letters'), orderBy('timestamp', 'desc')), (snap) => {
                const list = document.getElementById('letterList');
                list.innerHTML = snap.docs.map(d => `
                    <div class="p-5 bg-white rounded-3xl shadow-sm border border-pink-50 relative">
                        <p class="text-gray-700 font-handwritten text-lg">${d.data().text}</p>
                        <button onclick="deleteItem('letters', '${d.id}')" class="absolute top-2 right-2 text-gray-300">✕</button>
                    </div>
                `).join('') || '<p class="text-center text-gray-400 py-10">No letters yet.</p>';
            });
        }

        window.deleteItem = async (col, id) => { if(confirm("Delete this?")) await deleteDoc(doc(db, col, id)); };

        // IMAGE COMPRESSION LOGIC (The "Smooth Loading" Secret)
        document.getElementById('photoInput').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            document.getElementById('loadingOverlay').style.display = 'flex';
            document.getElementById('loadingText').innerText = "Compressing memory...";

            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = async () => {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 800; // Shrink to 800px wide
                    let width = img.width;
                    let height = img.height;

                    if (width > MAX_WIDTH) {
                        height *= MAX_WIDTH / width;
                        width = MAX_WIDTH;
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    // Convert to small JPEG (Quality 0.6)
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.6);

                    await addDoc(collection(db, 'photos'), {
                        url: dataUrl,
                        timestamp: Date.now(),
                        user: auth.currentUser.uid
                    });
                    document.getElementById('loadingOverlay').style.display = 'none';
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        document.getElementById('addLetterBtn').addEventListener('click', () => document.getElementById('letterModal').classList.remove('hidden'));
        document.getElementById('closeLetterModal').addEventListener('click', () => document.getElementById('letterModal').classList.add('hidden'));
        document.getElementById('saveLetterBtn').addEventListener('click', async () => {
            const text = document.getElementById('letterText').value.trim();
            if (text) {
                await addDoc(collection(db, 'letters'), { text, timestamp: Date.now(), user: auth.currentUser.uid });
                document.getElementById('letterText').value = '';
                document.getElementById('letterModal').classList.add('hidden');
            }
        });

        window.showPage = (id) => {
            document.querySelectorAll('.page').forEach(p => p.classList.add('hidden-page'));
            document.getElementById(id).classList.remove('hidden-page');
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.replace('text-pink-500', 'text-pink-300'));
            document.getElementById(`nav-${id}`).classList.replace('text-pink-300', 'text-pink-500');
        };

        setInterval(() => {
            const diff = new Date() - startDate;
            document.getElementById('days').innerText = Math.floor(diff / (1000 * 60 * 60 * 24));
            document.getElementById('hours').innerText = Math.floor((diff % (86400000)) / 3600000);
            document.getElementById('mins').innerText = Math.floor((diff % 3600000) / 60000);
        }, 1000);
    </script>
</body>
</html>
